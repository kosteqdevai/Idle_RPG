<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idle RPG</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #11140f;
        color: #f5f0df;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #1f3324, #11140f);
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .panel {
        border: 1px solid rgba(245, 240, 223, 0.14);
        border-radius: 8px;
        padding: 18px;
        background: rgba(0, 0, 0, 0.2);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0 0 12px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        color: #d7c782;
      }

      button {
        min-height: 40px;
        border: 1px solid rgba(245, 240, 223, 0.24);
        border-radius: 6px;
        padding: 0 12px;
        background: #d7c782;
        color: #17180f;
        font-weight: 700;
        cursor: pointer;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .stats,
      .list {
        display: grid;
        gap: 8px;
        padding: 0;
        list-style: none;
      }

      .stats {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        margin-bottom: 16px;
      }

      .stats span,
      .list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid rgba(245, 240, 223, 0.12);
        border-radius: 6px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.04);
      }

      .commander-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
        padding: 0;
        margin: 0 0 16px;
        list-style: none;
      }

      .commander-card {
        display: grid;
        grid-template-columns: 44px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        border: 1px solid rgba(245, 240, 223, 0.12);
        border-radius: 6px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.04);
      }

      .commander-card span {
        display: grid;
        gap: 3px;
      }

      .commander-card small {
        color: rgba(245, 240, 223, 0.68);
        text-transform: uppercase;
        font-size: 11px;
      }

      .commander-icon,
      .commander-sprite {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
      }

      .combat-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
        gap: 14px;
        align-items: stretch;
        margin-bottom: 16px;
      }

      .combat-arena,
      .combat-history {
        min-height: 292px;
      }

      .combat-arena {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 12px;
      }

      .combat-stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(112px, 1fr) minmax(70px, 0.55fr) minmax(112px, 1fr);
        align-items: center;
        min-height: 220px;
        overflow: hidden;
        border: 1px solid rgba(245, 240, 223, 0.14);
        border-radius: 6px;
        padding: 12px;
        background:
          linear-gradient(180deg, rgba(48, 70, 55, 0.74), rgba(21, 23, 20, 0.9)),
          repeating-linear-gradient(90deg, rgba(245, 240, 223, 0.04) 0 2px, transparent 2px 18px);
      }

      .combat-stage::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 42px;
        background: linear-gradient(180deg, transparent, rgba(13, 15, 12, 0.8));
      }

      .combatant {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 6px;
        text-align: center;
      }

      .combatant small {
        color: rgba(245, 240, 223, 0.68);
      }

      .combat-sprite {
        width: 58px;
        height: 70px;
        image-rendering: pixelated;
        filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.28));
      }

      .hero .combat-sprite {
        background:
          linear-gradient(#f5f0df 0 0) 24px 6px / 12px 12px,
          linear-gradient(#4f8fd9 0 0) 16px 20px / 28px 28px,
          linear-gradient(#d7c782 0 0) 20px 48px / 8px 18px,
          linear-gradient(#d7c782 0 0) 32px 48px / 8px 18px;
        background-repeat: no-repeat;
        animation: hero-step 900ms ease-in-out infinite;
      }

      .enemy .combat-sprite {
        background:
          linear-gradient(#f0c45c 0 0) 22px 4px / 14px 14px,
          linear-gradient(#b84b5f 0 0) 14px 18px / 32px 34px,
          linear-gradient(#2f2228 0 0) 12px 52px / 36px 12px;
        background-repeat: no-repeat;
        animation: enemy-brace 900ms ease-in-out infinite;
      }

      .strike-line {
        position: relative;
        z-index: 1;
        height: 4px;
        border-radius: 999px;
        background: rgba(245, 240, 223, 0.16);
        overflow: hidden;
      }

      .strike-line::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: #f0c45c;
        box-shadow: 0 0 16px rgba(240, 196, 92, 0.8);
        animation: strike-travel 900ms ease-in-out infinite;
      }

      .combat-summary {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr auto 1fr;
        gap: 8px;
        align-items: center;
        min-height: 42px;
        border: 1px solid rgba(245, 240, 223, 0.12);
        border-radius: 6px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.04);
      }

      .combat-summary span,
      .combat-history h3 {
        color: rgba(245, 240, 223, 0.68);
        font-size: 12px;
        text-transform: uppercase;
      }

      .combat-history {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
        border: 1px solid rgba(245, 240, 223, 0.12);
        border-radius: 6px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.04);
      }

      .combat-history ul {
        display: grid;
        align-content: start;
        gap: 8px;
        min-height: 0;
        max-height: 242px;
        overflow: auto;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .combat-history li {
        display: grid;
        gap: 4px;
        border-bottom: 1px solid rgba(245, 240, 223, 0.1);
        padding-bottom: 8px;
      }

      .combat-history strong {
        color: #f0c45c;
      }

      @keyframes hero-step {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(16px);
        }
      }

      @keyframes enemy-brace {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(6px);
        }
      }

      @keyframes strike-travel {
        0% {
          transform: translateX(-105%);
        }
        55%,
        100% {
          transform: translateX(245%);
        }
      }

      progress {
        width: 100%;
        accent-color: #d7c782;
      }

      @media (max-width: 720px) {
        main {
          width: min(100% - 20px, 980px);
          padding: 12px 0;
        }

        .combat-layout {
          grid-template-columns: 1fr;
        }

        .combat-arena,
        .combat-history {
          min-height: auto;
        }

        .combat-stage {
          grid-template-columns: minmax(90px, 1fr) 48px minmax(90px, 1fr);
          min-height: 190px;
        }

        .combat-summary {
          grid-template-columns: auto 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Idle RPG</h1>
      <div id="app"></div>
    </main>
    <script type="module">
      import { initialiseGame } from "./ui/browser/app.mjs?v=20260505-corpse-army";

      initialiseGame(document.querySelector("#app"));
    </script>
  </body>
</html>
