<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idle RPG</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #11140f;
        color: #f5f0df;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #1f3324, #11140f);
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .panel {
        border: 1px solid rgba(245, 240, 223, 0.14);
        border-radius: 8px;
        padding: 18px;
        background: rgba(0, 0, 0, 0.2);
      }

      h1,
      h2,
      p {
        margin: 0 0 12px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        color: #d7c782;
      }

      button {
        min-height: 40px;
        border: 1px solid rgba(245, 240, 223, 0.24);
        border-radius: 6px;
        padding: 0 12px;
        background: #d7c782;
        color: #17180f;
        font-weight: 700;
        cursor: pointer;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .stats,
      .list {
        display: grid;
        gap: 8px;
        padding: 0;
        list-style: none;
      }

      .stats {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        margin-bottom: 16px;
      }

      .stats span,
      .list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid rgba(245, 240, 223, 0.12);
        border-radius: 6px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.04);
      }

      .commander-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
        padding: 0;
        margin: 0 0 16px;
        list-style: none;
      }

      .commander-card {
        display: grid;
        grid-template-columns: 44px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        border: 1px solid rgba(245, 240, 223, 0.12);
        border-radius: 6px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.04);
      }

      .commander-card span {
        display: grid;
        gap: 3px;
      }

      .commander-card small {
        color: rgba(245, 240, 223, 0.68);
        text-transform: uppercase;
        font-size: 11px;
      }

      .commander-icon,
      .commander-sprite {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
      }

      progress {
        width: 100%;
        accent-color: #d7c782;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Idle RPG</h1>
      <div id="app"></div>
    </main>
    <script type="module">
      import { initialiseGame } from "./ui/browser/app.mjs?v=20260505-commanders";

      initialiseGame(document.querySelector("#app"));
    </script>
  </body>
</html>
